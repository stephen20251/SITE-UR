<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne — UR Online</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
           background: linear-gradient(135deg, #1a1333, #3b2d8f); color: #fff; text-align: center; }
    .card { padding: 40px 32px; max-width: 380px; }
    .logo { font-size: 52px; }
    h1 { margin: 16px 0 8px; font-size: 24px; }
    p { margin: 0; color: rgba(255,255,255,.75); line-height: 1.6; font-size: 15px; }
    button { margin-top: 24px; padding: 12px 28px; border: 0; border-radius: 12px;
             background: #d4af37; color: #241c00; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de joindre UR Online pour le moment. Vérifiez votre connexion internet — vos progrès et notes sont en sécurité et vous retrouverez tout à votre retour.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
